<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">	<defs>		<clipPath id="pill">			<rect x="6" y="22" width="52" height="20" rx="10"/>		</clipPath>	</defs>	<!-- olive tile: keeps the black stripe visible on dark browser tabs -->	<rect width="64" height="64" rx="14" fill="#EEF0E0"/>	<!-- the Stripe: black | red | gold -->	<g clip-path="url(#pill)">		<rect x="6"    y="22" width="52"    height="20" fill="#000000"/>		<rect x="23.33" y="22" width="17.34" height="20" fill="#DD0000"/>		<rect x="40.67" y="22" width="17.33" height="20" fill="#FFCE00"/>	</g></svg>